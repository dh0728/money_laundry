name: CI

on:
  push:
    branches:
      - dev
      - master
      - fe/work
      - frontend

  pull_request:
    branches:
      - fe/work
      - frontend
      - dev
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  split-deployment-check:
    name: Split deployment configuration and recovery tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s deploy/split/tests -p 'test_*.py'
      - run: python deploy/split/validate.py

  deploy-dev-split:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && vars.AML_DEPLOY_LAYOUT == 'split' && vars.AML_DEV_DEPLOY_ENABLED == 'true'
    needs: [backend, frontend, split-deployment-check]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-split.yml
    with:
      environment: dev
      git_sha: ${{ github.sha }}
      operation: deploy
    secrets: inherit

  deploy-prod-split:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.AML_DEPLOY_LAYOUT == 'split' && vars.AML_PROD_DEPLOY_ENABLED == 'true'
    needs: [backend, frontend, split-deployment-check]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-split.yml
    with:
      environment: prod
      git_sha: ${{ github.sha }}
      operation: deploy
    secrets: inherit

  backend:
    name: Backend Test and Build
    # fe/work push는 프론트 작업 브랜치라 프론트 검사만 돈다.
    if: (github.event_name != 'pull_request' || github.base_ref != 'frontend') && github.ref != 'refs/heads/fe/work'
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: backend/api-server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle build cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/master' }}

      - name: Set up Python worker runtime
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/api-server/worker/requirements.txt

      - name: Install worker dependencies
        run: '"${{ steps.python.outputs.python-path }}" -m pip install -r worker/requirements.txt'

      - name: Grant execute permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Run backend tests and build
        env:
          AML_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
        run: ./gradlew clean build --build-cache --no-daemon --stacktrace

      - name: Run Python worker and PostgreSQL tests
        env:
          AML_TEST_DOCKER: docker
        run: '"${{ steps.python.outputs.python-path }}" -B -m unittest discover -s worker -p "test_*.py"'

  frontend:
    name: Frontend Lint and Build
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend/web-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js 24
        uses: pnpm/setup@v2
        with:
          version: 11.24.0
          runtime: node@24
          cache: true
          cache-dependency-path: frontend/web-app/pnpm-lock.yaml
          package-json-file: frontend/web-app/package.json
          install: false

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend lint
        run: pnpm run lint

      - name: Run frontend tests
        run: pnpm test --maxWorkers 4

      - name: Install Chromium for UI checks
        run: pnpm exec playwright install --with-deps chromium

      - name: Check workspace scroll ownership
        run: pnpm run test:scroll

      - name: Build frontend
        env:
          VITE_API_MODE: live
        run: |
          pnpm run build
          test "$(find dist -type f -name '*.html')" = 'dist/index.html'
          test -z "$(find dist -type f -name 'ibm-hi-small-*.json')"

      - name: Check design rules
        run: pnpm run lint:design --strict

  docker-images:
    name: Docker Image Build
    if: github.event_name == 'pull_request' && github.base_ref != 'frontend'
    runs-on: ubuntu-24.04
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend Docker image
        uses: docker/build-push-action@v7
        with:
          context: backend/api-server
          outputs: type=cacheonly
          cache-from: type=gha,scope=aml-api
          cache-to: type=gha,mode=max,scope=aml-api,ignore-error=true

      - name: Build frontend Docker image
        uses: docker/build-push-action@v7
        with:
          context: frontend/web-app
          outputs: type=cacheonly
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_API_MODE=live
          cache-from: type=gha,scope=aml-web
          cache-to: type=gha,mode=max,scope=aml-web,ignore-error=true
