name: CI

on:
  push:
    branches:
      - dev
      - master

  pull_request:
    branches:
      - dev
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Test and Build
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: backend/api-server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            backend/api-server/*.gradle
            backend/api-server/gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Run backend tests and build
        run: ./gradlew clean build --no-daemon --stacktrace

  frontend:
    name: Frontend Lint and Build
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend/web-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js 24
        uses: pnpm/setup@v2
        with:
          version: 11.24.0
          runtime: node@24
          cache: true
          cache-dependency-path: frontend/web-app/pnpm-lock.yaml
          package-json-file: frontend/web-app/package.json
          install: false

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend lint
        run: pnpm run lint

      - name: Build frontend
        run: pnpm run build

  docker-images:
    name: Docker Image Build
    runs-on: ubuntu-24.04
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build backend Docker image
        run: |
          docker build \
            --tag aml-api:ci-${{ github.sha }} \
            backend/api-server

      - name: Build frontend Docker image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=/api \
            --tag aml-web:ci-${{ github.sha }} \
            frontend/web-app

      - name: Show built Docker images
        run: |
          docker image inspect aml-api:ci-${{ github.sha }} >/dev/null
          docker image inspect aml-web:ci-${{ github.sha }} >/dev/null
