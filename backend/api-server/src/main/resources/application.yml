spring:
  application:
    name: api-server
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aml}
    username: ${DB_USERNAME:aml}
    password: ${DB_PASSWORD:aml}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # 화면 board 응답(수 MB JSON)을 gzip으로 보낸다. 같은 응답이 약 1/15로 준다.
  compression:
    enabled: true
    mime-types: application/json,application/problem+json
    min-response-size: 2KB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

app:
  dashboard:
    refresh-enabled: ${DASHBOARD_REFRESH_ENABLED:true}
    refresh-delay-ms: ${DASHBOARD_REFRESH_DELAY_MS:5000}
  presentation:
    enabled: ${PRESENTATION_ENABLED:false}
  s3:
    bucket: ${S3_BUCKET:}
    prefix: ${S3_PREFIX:}
    region: ${AWS_REGION:ap-northeast-2}
  storage-dir: ${STORAGE_DIR:./storage}
  zone: ${APP_ZONE:Asia/Seoul}
  rules:
    # 바쁜 계좌: window-minutes 안에 같은 방향 거래가 max-transactions 건을 넘는 계좌. 룰의 대상에서 뺀다. 0 이면 두지 않는다.
    busy:
      max-transactions: ${RULES_BUSY_MAX_TRANSACTIONS:512}
      window-minutes: ${RULES_BUSY_WINDOW_MINUTES:4320}
    # 원장 첫날부터 이 날짜 수만큼은 이력으로만 쓰고 검사하지 않는다.
    warmup-days: ${RULES_WARMUP_DAYS:7}
    # 관리자가 자기가 쓴 버전을 승인할 수 있는가. false 면 작성자 본인의 승인을 403 으로 막는다.
    self-approval: ${RULES_SELF_APPROVAL:true}
  ingest:
    encryption-key: ${INGEST_ENCRYPTION_KEY:}
    search-key: ${INGEST_SEARCH_KEY:}
    key-version: ${INGEST_KEY_VERSION:}
    url-ttl: ${INGEST_URL_TTL:PT15M}
    max-size-bytes: ${INGEST_MAX_SIZE_BYTES:209715200}
    cutoff: ${INGEST_CUTOFF:03:00}
    fx-rate-version: fx_rates_usd_v1
  worker:
    db-username: ${ANALYSIS_DB_USERNAME:}
    db-password: ${ANALYSIS_DB_PASSWORD:}
    mode: ${WORKER_MODE:unconfigured}
    python: ${WORKER_PYTHON:python}
    script: ${WORKER_SCRIPT:worker/analysis_entry.py}
    timeout: ${WORKER_TIMEOUT:PT30M}
  inference:
    allow-loopback: ${INFERENCE_ALLOW_LOOPBACK:false}
    url: ${INFERENCE_API_URL:}
    token: ${INFERENCE_API_TOKEN:}
    ca-file: ${INFERENCE_CA_FILE:}
  suspicious-tx:
    threshold: ${SUSPICIOUS_TX_THRESHOLD:0.7}
  # AI 요약·보고서의 Claude 호출. 키가 비어 있으면 AI 요약은 503 AI_SUMMARY_UNAVAILABLE 이다.
  ai:
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    model: ${AI_MODEL:claude-haiku-5-5}
    report-model: ${AI_REPORT_MODEL:claude-sonnet-5-5}
