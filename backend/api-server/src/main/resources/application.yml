spring:
  application:
    name: api-server
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aml}
    username: ${DB_USERNAME:aml}
    password: ${DB_PASSWORD:aml}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

app:
  storage-dir: ${STORAGE_DIR:./storage}
  worker:
    python: ${WORKER_PYTHON:python}
    script: ${WORKER_SCRIPT:worker/dummy_worker.py}
