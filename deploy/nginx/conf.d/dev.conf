upstream aml_dev_web {
    server 127.0.0.1:3001;
}

upstream aml_dev_api {
    server 127.0.0.1:8081;
}

server {
    listen 80;
    listen 443 ssl;
    server_name dev.aiaml.co.kr;

    ssl_certificate /etc/nginx/ssl/cloudflare/aiaml.co.kr.pem;
    ssl_certificate_key /etc/nginx/ssl/cloudflare/aiaml.co.kr.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/aiaml-dev-access.log;
    error_log /var/log/nginx/aiaml-dev-error.log;

    server_tokens off;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api {
        return 308 /api/;
    }

    location /api/ {
        proxy_pass http://aml_dev_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://aml_dev_web;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
