name: aml-prod-front-green
services:
  web:
    image: ${PROD_WEB_IMAGE:?PROD_WEB_IMAGE is required}
    pull_policy: always
    restart: unless-stopped
    ports:
    - 127.0.0.1:3002:80
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    networks:
    - prod-network
networks:
  prod-network:
    name: aml-prod-front-green-network
    driver: bridge
