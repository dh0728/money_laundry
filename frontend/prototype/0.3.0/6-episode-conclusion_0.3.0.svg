idth="1"/><text x="1744" y="175" font-family="Noto Sans KR" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">종결</text><text x="1808" y="175" font-family="Noto Sans KR" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">↗</text><rect x="1464" y="137" width="200" height="64" fill="#FFFFFF" stroke="#222222" stroke-width="1"/><text x="1556" y="175" font-family="Noto Sans KR" font-size="16" font-weight="700" fill="#222222" text-anchor="middle">보고서 미리보기</text><text x="1640" y="175" font-family="Noto Sans KR" font-size="14" font-weight="700" fill="#222222" text-anchor="middle">↗</text><line x1="128" y1="270" x2="1832" y2="270" stroke="#222222" stroke-width="2"/></g><g id="Tabs"><text x="179" y="306" font-family="Noto Sans KR" font-size="15" font-weight="400" fill="#666666" text-anchor="middle">조사 개요</text><text x="289" y="306" font-family="Noto Sans KR" font-size="15" font-weight="400" fill="#666666" text-anchor="middle">자금 흐름</text><text x="399" y="306" font-family="Noto Sans KR" font-size="15" font-weight="400" fill="#666666" text-anchor="middle">패턴 증거</text><text x="530" y="306" font-family="Noto Sans KR" font-size="15" font-weight="400" fill="#666666" text-anchor="middle">상대방 · 이력</text><text x="640" y="306" font-family="Noto Sans KR" font-size="15" font-weight="700" fill="#222222" text-anchor="middle">결론</text><rect x="610" y="318" width="60" height="3" fill="#222222" stroke="#222222" stroke-width="1"/><text x="1788" y="306" font-family="Noto Sans KR" font-size="14" font-weight="400" fill="#666666" text-anchor="middle">감사 로그</text><line x1="128" y1="321" x2="1832" y2="321" stroke="#C8C8C8" stroke-width="1"/></g><text x="128" y="342" font-family="Noto Sans KR" font-size="11" font-weight="400" fill="#999999" text-anchor="start">참고 · Lucinity SAR Preview — 폼 + 오른쪽 변경 이력</text><g id="Form / 결론"><text x="128" y="382" font-family="Noto Sans KR" font-size="13" font-weight="700" fill="#666666" text-anchor="start">who (주체 · 상대)</text><rect x="128" y="394" width="636" height="52" fill="#FFFFFF" stroke="#9A9A9A" stroke-width="1"/><text x="144" y="426" font-family="Noto Sans KR" font-size="13" font-weight="400" fill="#222222" text-anchor="start">8007A5B70(00220) ← 9개 은행 11계좌 / → 6개 은행 순환</text><text x="780" y="382" font-family="Noto Sans KR" font-size="13" font-weight="700" fill="#666666" text-anchor="start">what · when</text><rect x="780" y="394" width="636" height="52" fill="#FFFFFF" stroke="#9A9A9A" stroke-width="1"/><text x="796" y="426" font-family="Noto Sans KR" font-size="13" font-weight="400" fill="#222222" text-anchor="start">3일간 USD 688K 집중 수취 (08-31~09-02), 이후 4일 10 hop 순환 86K</text><text x="128" y="486" font-family="Noto Sans KR" font-size="13" font-weight="700" fill="#666666" text-anchor="start">where</text><rect x="128" y="498" width="636" height="52" fill="#FFFFFF" stroke="#9A9A9A" stroke-width="1"/><text x="144" y="530" font-family="Noto Sans KR" font-size="13" font-weight="400" fill="#222222" text-anchor="start">은행 11곳, 매 hop 타행 · 국가 PT·GB·DE·CA…</text><text x="780" y="486" font-family="Noto Sans KR" font-size="13" font-weight="700" fill="#666666" text-anchor="start">why (합리적 설명 부재)</text><rect x="780" y="498" width="636" height="52" fill="#FFFFFF" stroke="#9A9A9A" stroke-width="1"/><text x="796" y="530" font-family="Noto Sans KR" font-size="13" font-weight="400" fill="#222222" text-anchor="start">계좌 연령 16일 · 30일 기준선 ×32 · 상대방 전부 신규</text><text x="128" y="590" font-family="Noto Sans KR" font-size="13" font-weight="700" fill="#666666" text-anchor="start">how (수법)</text><rect x="128" y="602" width="636" height="52" fill="#FFFFFF" stroke="#9A9A9A" stroke-width="1"/><text x="144" y="634" font-family="Noto Sans KR" font-size="13" font-weight="400" fill="#222222" text-anchor="start">FAN-IN 후 보유, 일부를 수수료형 CYCLE로 층화</text><text x="780" y="590" font-family="Noto Sans KR" font-size="13" font-weight="700" fill="#666666" text-anchor="start">미확인 (외부 필요)</text><rect x="780" y="602" width="636" height="52" fill="#FFFFFF" stroke="#9A9A9A" stroke-width="1"/><text x="796" y="634" font-family="Noto Sans KR" font-size="13" font-weight="400" fill="#222222" text-anchor="start">상대방 신원·업종 · 제재/PEP · 실명 정보</text><text x="128" y="690" font-family="Noto Sans KR" font-size="13" font-weight="700" fill="#666666" text-anchor="start">판정</text><circle cx="138" cy="720" r="9" fill="#FFFFFF" stroke="#222222"/><text x="156" y="725" font-family="Noto Sans KR" font-size="14" font-weight="400" fill="#222222" text-anchor="start">정상 (NORMAL)</text><circle cx="358" cy="720" r="9" fill="#FFFFFF" stroke="#222222"/><text x="376" y="725" font-family="Noto Sans KR" font-size="14" font-weight="400" fill="#222222" text-anchor="start">의심 (SUSPICIOUS)</text><text x="128" y="774" font-family="Noto Sans KR" font-size="13" font-weight="700" fill="#666666" text-anchor="start">결론 서술 (필수)</text><rect x="128" y="786" width="1288" height="150" fill="#FFFFFF" stroke="#9A9A9A" stroke-width="1"/><text x="144" y="818" font-family="Noto Sans KR" font-size="13" font-weight="400" fill="#999999" text-anchor="start">위 여섯 칸을 문장으로…</text><text x="128" y="980" font-family="Noto Sans KR" font-size="12" font-weight="400" fill="#999999" text-anchor="start">판정과 결론 서술이 모두 있어야 종결 확정 활성 · 혐의도는 미채택 후보</text><rect x="1060" y="958" width="160" height="52" fill="#FFFFFF" stroke="#222222" stroke-width="1"/><text x="1140" y="989" font-family="Noto Sans KR" font-size="14" font-weight="700" fill="#222222" text-anchor="middle">임시 저장</text><rect x="1236" y="958" width="180" height="52" fill="#9A9A9A" stroke="#9A9A9A" stroke-width="1"/><text x="1326" y="989" font-family="Noto Sans KR" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">종결 확정</text></g><g id="Rail / 변경 이력 · 의견"><rect x="1432" y="352" width="400" height="688" fill="#FAFAFA" stroke="#C8C8C8" stroke-width="1"/><text x="1452" y="384" font-family="Noto Sans KR" font-size="15" font-weight="700" fill="#222222" text-anchor="start">변경 이력 · 의견</text><circle cx="1458" cy="420" r="6" fill="#9A9A9A"/><line x1="1458" y1="428" x2="1458" y2="512" stroke="#C8C8C8" stroke-width="1"/><text x="1476" y="424" font-family="Noto Sans KR" font-size="13" font-weight="700" fill="#222222" text-anchor="start">조사 개시</text><text x="1476" y="444" font-family="Noto Sans KR" font-size="12" font-weight="400" fill="#666666" text-anchor="start">SYSTEM → 이분석 (라운드로빈) · 09-02 09:40</text><text x="1476" y="466" font-family="Noto Sans KR" font-size="12" font-weight="400" fill="#222222" text-anchor="start">"9개 은행에서 3일간 집중 입금. 원천 확인 필요."</text><circle cx="1458" cy="516" r="6" fill="#9A9A9A"/><line x1="1458" y1="524" x2="1458" y2="608" stroke="#C8C8C8" stroke-width="1"/><text x="1476" y="520" font-family="Noto Sans KR" font-size="13" font-weight="700" fill="#222222" text-anchor="start">AL-000233 연결</text><text x="1476" y="540" font-family="Noto Sans KR" font-size="12" font-weight="400" fill="#666666" text-anchor="start">최검토 (L1) · 09-03 10:15</text><text x="1476" y="562" font-family="Noto Sans KR" font-size="12" font-weight="400" fill="#222222" text-anchor="start">"같은 계좌가 순환 경로의 출발점."</text><circle cx="1458" cy="612" r="6" fill="#9A9A9A"/><line x1="1458" y1="620" x2="1458" y2="704" stroke="#C8C8C8" stroke-width="1"/><text x="1476" y="616" font-family="Noto Sans KR" font-size="13" font-weight="700" fill="#222222" text-anchor="start">의견</text><text x="1476" y="636" font-family="Noto Sans KR" font-size="12" font-weight="400" fill="#666666" text-anchor="start">이분석 (L2) · 09-03 16:02</text><text x="1476" y="658" font-family="Noto Sans KR" font-size="12" font-weight="400" fill="#222222" text-anchor="start">"입금 12건 중 10건이 30일 내 신규 상대방."</text><circle cx="1458" cy="708" r="6" fill="#9A9A9A"/><text x="1476" y="712" font-family="Noto Sans KR" font-size="13" font-weight="700" fill="#222222" text-anchor="start">결론 임시 저장</text><text x="1476" y="732" font-family="Noto Sans KR" font-size="12" font-weight="400" fill="#666666" text-anchor="start">이분석 (L2) · 09-04 09:10</tex