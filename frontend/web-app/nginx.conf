server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # React Router 경로에서 새로고침해도 index.html을 반환한다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 해시가 포함된 Vite 빌드 파일은 장기간 캐시한다.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 새 배포 내용을 즉시 확인하도록 HTML은 캐시하지 않는다.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
